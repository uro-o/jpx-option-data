name: JPX Open Interest Download


# ============================================================
# 実行タイミング
# ============================================================

on:

  # 毎日 20:30（日本時間）
  schedule:

    - cron: '30 20 * * *'
      timezone: 'Asia/Tokyo'


  # GitHub Actions画面から手動実行
  workflow_dispatch:


# ============================================================
# Job
# ============================================================

jobs:

  download:

    runs-on: ubuntu-latest


    steps:


      # ======================================================
      # 1. GitHub Repositoryを取得
      # ======================================================

      - name: Checkout repository

        uses: actions/checkout@v5

        with:

          fetch-depth: 0


      # ======================================================
      # 2. Pythonをセットアップ
      # ======================================================

      - name: Setup Python

        uses: actions/setup-python@v6

        with:

          python-version: '3.12'


      # ======================================================
      # 3. Pythonライブラリをインストール
      # ======================================================

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # ======================================================
      # 4. JPXから建玉残高表をダウンロード
      # ======================================================

      - name: Download JPX Open Interest

        run: |

          python jpx_download.py


      # ======================================================
      # 5. ダウンロードされたExcelを確認
      # ======================================================

      - name: Check downloaded files

        run: |

          echo "========================================"

          echo "Current directory"

          echo "========================================"

          pwd


          echo ""

          echo "========================================"

          echo "Repository files"

          echo "========================================"

          ls -lah


          echo ""

          echo "========================================"

          echo "data directory"

          echo "========================================"

          ls -lah data/ || true


          echo ""

          echo "========================================"

          echo "Excel files"

          echo "========================================"

          find data -type f -name "*.xlsx" -print || true


      # ======================================================
      # 6. ExcelからDashboard用データを作成
      # ======================================================

      - name: Build dashboard data

        run: |

          echo "========================================"

          echo "Building dashboard data"

          echo "========================================"


          python dashboard/build_dashboard.py


      # ======================================================
      # 7. Dashboard生成結果を確認
      # ======================================================

      - name: Check dashboard files

        run: |

          echo "========================================"

          echo "Dashboard directory"

          echo "========================================"

          ls -lah dashboard/ || true


          echo ""

          echo "========================================"

          echo "Dashboard public directory"

          echo "========================================"

          ls -lah dashboard/public/ || true


          echo ""

          echo "========================================"

          echo "Generated data.json"

          echo "========================================"


          if [ -f dashboard/public/data.json ]; then

            echo "data.json exists"

            echo ""

            head -100 dashboard/public/data.json

          else

            echo "ERROR: data.json was not generated"

            exit 1

          fi


      # ======================================================
      # 8. Git設定
      # ======================================================

      - name: Configure Git

        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


      # ======================================================
      # 9. 変更されたファイルをGitに追加
      # ======================================================

      - name: Stage downloaded data

        run: |

          echo "========================================"

          echo "Adding files to Git"

          echo "========================================"


          git add -A


          echo ""

          echo "========================================"

          echo "Git status"

          echo "========================================"


          git status


          echo ""

          echo "========================================"

          echo "Staged files"

          echo "========================================"


          git diff --cached --name-status


      # ======================================================
      # 10. Commit
      # ======================================================

      - name: Commit downloaded data

        run: |

          echo "========================================"

          echo "Commit"

          echo "========================================"


          if git diff --cached --quiet; then

            echo "新しいデータはありません。"

          else

            git commit \
              -m "Update JPX open interest data"

          fi


      # ======================================================
      # 11. GitHubへPush
      # ======================================================

      - name: Push downloaded data

        run: |

          echo "========================================"

          echo "Push to GitHub"

          echo "========================================"


          git push
