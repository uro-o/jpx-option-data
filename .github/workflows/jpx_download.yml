name: JPX Open Interest Download


# ============================================================
# 実行タイミング
# ============================================================

on:

  # 毎日 20:30（日本時間）
  schedule:

    - cron: '30 20 * * *'
      timezone: 'Asia/Tokyo'


  # GitHub画面から手動実行できるようにする
  workflow_dispatch:


# ============================================================
# Job
# ============================================================

jobs:

  download:

    runs-on: ubuntu-latest


    steps:


      # --------------------------------------------------------
      # Repositoryを取得
      # --------------------------------------------------------

      - name: Checkout repository

        uses: actions/checkout@v5

        with:
          fetch-depth: 0


      # --------------------------------------------------------
      # Pythonセットアップ
      # --------------------------------------------------------

      - name: Setup Python

        uses: actions/setup-python@v6

        with:
          python-version: '3.12'


      # --------------------------------------------------------
      # Pythonライブラリインストール
      # --------------------------------------------------------

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # --------------------------------------------------------
      # JPXデータ取得
      # --------------------------------------------------------

      - name: Download JPX Open Interest

        run: |

          python jpx_download.py


      # --------------------------------------------------------
      # ダウンロード結果確認
      # --------------------------------------------------------

      - name: Check downloaded files

        run: |

          echo "========================================"
          echo "Current directory"
          echo "========================================"

          pwd


          echo ""
          echo "========================================"
          echo "Directory list"
          echo "========================================"

          ls -lah


          echo ""
          echo "========================================"
          echo "data directory"
          echo "========================================"

          ls -lah data/ || true


          echo ""
          echo "========================================"
          echo "Excel files"
          echo "========================================"

          find . -type f -name "*.xlsx" -print


      # --------------------------------------------------------
      # Git設定
      # --------------------------------------------------------

      - name: Configure Git

        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


      # --------------------------------------------------------
      # Gitへ追加
      # --------------------------------------------------------

      - name: Stage downloaded data

        run: |

          git add -A


          echo ""
          echo "========================================"
          echo "Git status"
          echo "========================================"

          git status


          echo ""
          echo "========================================"
          echo "Staged files"
          echo "========================================"

          git diff --cached --name-status


      # --------------------------------------------------------
      # Commit
      # --------------------------------------------------------

      - name: Commit downloaded data

        run: |

          if git diff --cached --quiet; then

            echo "新しいデータはありません。"

          else

            git commit \
              -m "Update JPX open interest data"

          fi


      # --------------------------------------------------------
      # GitHubへPush
      # --------------------------------------------------------

      - name: Push downloaded data

        run: |

          git push
